[project]
name = "field-return-triage"
version = "0.1.0"
description = "Which returned parts need a closer look, and which test should run first?"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Saber Sojudi" }]
keywords = ["field-return", "triage", "complaints", "extraction", "quality"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.28.1",
  "pydantic==2.14.1",
  "typer==0.27.3",
]

[project.scripts]
frt = "field_return_triage.cli:app"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-socket==0.8.1",
  "ruff==0.17.3",
  "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_return_triage"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The network block is part of the invocation, not a convention: pytest-socket re-arms
# it before every test. Unix sockets stay allowed for local IPC and subprocess pipes.
addopts = "-ra --strict-markers --strict-config --disable-socket --allow-unix-socket"
markers = [
  "slow: long-running test (still offline)",
]
filterwarnings = [
  "error::DeprecationWarning:field_return_triage.*",
  "error::DeprecationWarning:tests.*",
]
log_cli_level = "INFO"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["dist", "web", "data"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PT", "RET",
  "SIM", "PTH", "RUF",
]
ignore = [
  "E501",   # line length is enforced by the formatter
  "B008",   # typer uses function calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]                  # command-line scripts may print
"src/field_return_triage/cli.py" = ["T201"]  # the CLI is a terminal surface
"tests/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
files = ["src"]
mypy_path = "src"
plugins = []
exclude = ["^\\.venv/", "^dist/", "^web/"]

[[tool.mypy.overrides]]
# Third-party packages without PEP 561 markers. Keep this list short and explained:
# every entry is a package we import but cannot type-check. `field_return_triage` itself
# is always checked strictly.
module = [
  "pytest_socket.*",
]
ignore_missing_imports = true
