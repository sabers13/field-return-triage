# Source: the OpenCode Go pricing table at https://opencode.ai/docs/go/ (read
# 2026-10-31, the day this file was written). Prices change; R7 re-reads the page
# before the live run and records any difference with the run, per PLAN §8.
#
# Tiered models use the base tier (<= 200K/256K/272K tokens), because one extraction
# prompt is far below every tier boundary. Off-peak prices are kept for models that
# publish them; the pre-run estimate uses the higher price and the per-call cost uses
# the gateway's own list cost when it reports one.
#
# Gemini 4 Argon is priced at the 50% launch discount that runs through 2026-11-30
