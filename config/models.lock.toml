# Model lock: the pinned model ids and settings.
#
# Rule: primary = the which-ai-model defect card's "cheapest" pick (the cheapest model
# that meets the card's safety floor); comparison = that card's "most accurate" pick.
# The card says a model does meet the floor (no_model_meets_floor = false), so the
# cheapest good-enough model leads and safety still rests on the hard rules.
#
# Source: the committed defect card on which-ai-model's main after its M7 live run.
# Path is relative to that repository's root; the commit pins the exact card.
rule = "primary = defect card 'cheapest'; comparison = defect card 'most_accurate'"
source_repo = "which-ai-model"
source_card = "results/cards/defect.json"
source_commit = "f6c9abe8d329068030fc88fe3351cb36add35ffc"
card_picker_rule = "within 3.0 points of the best model on the primary metric; a model below any gate floor is not good enough; ties go to lower cost"
card_cheapest = "muse-spark-1.3-contributor"
card_most_accurate = "gemini-4-argon"
card_no_model_meets_floor = false
price_source = "config/prices.toml (OpenCode Go pricing table, re-read 2026-11-01)"

# muse-spark reasons before it answers: with the gateway's default effort it spent
# the whole allowance on hidden reasoning and returned empty content at 1024 and
# cut-off JSON at 8192 (probes of 2026-11-01). The client sends reasoning_effort=low
# for this model (llm/client.py REASONING_EFFORT). The smoke run then cut off 6 of
# 20 answers at 2048 tokens (reasoning plus JSON), so the live cap is 4096.
# gemini-4-argon answers in pretty-printed JSON, so a clue-rich 987-character
# narrative filled 640 tokens and was cut off; the cap is 1024.

[[models]]
role = "primary"
model_id = "muse-spark-1.3-contributor"
provider = "opencode-go"
base_url = "https://opencode.ai/inference/go/openai/v1"
temperature = 0.0
max_output_tokens = 4096

[[models]]
role = "comparison"
model_id = "gemini-4-argon"
provider = "opencode-go"
base_url = "https://opencode.ai/inference/go/openai/v1"
temperature = 0.0
max_output_tokens = 1024
